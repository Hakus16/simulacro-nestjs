services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-solicitudes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-solicitudes_dev_password}
      POSTGRES_DB: ${DB_DATABASE:-solicitudes_api}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3001:3000"
    environment:
      API_KEYS: ${API_KEYS:-clave-ficticia-1,clave-ficticia-2,clave-ficticia-3}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-solicitudes}
      DB_PASSWORD: ${DB_PASSWORD:-solicitudes_dev_password}
      DB_DATABASE: ${DB_DATABASE:-solicitudes_api}
    depends_on:
      - postgres

volumes:
  postgres_data:
